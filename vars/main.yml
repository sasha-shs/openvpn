---
openvpn_server_ip: "192.168.56.201"
openvpn_port: 1194
openvpn_proto: udp
openvpn_dev: tun
openvpn_user: nobody
openvpn_group: nogroup
openvpn_server_subnet: "10.0.0.0 255.255.255.0"
openvpn_ca: "/etc/openvpn/ca.crt"
openvpn_cert: "/etc/openvpn/server.crt"
